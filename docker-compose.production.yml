services:
  postgres:
    image: postgres:16-alpine
    container_name: pleero_postgres_prod
    environment:
      POSTGRES_DB: pleero
      POSTGRES_USER: pleero_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - pleero_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pleero_user -d pleero"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pleero_redis_prod
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_prod:/data
    networks:
      - pleero_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY}/pleero-backend:latest
    container_name: pleero_backend_prod
    environment:
      - DATABASE_URL=postgresql+asyncpg://pleero_user:${POSTGRES_PASSWORD}@postgres:5432/pleero
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SHOPIFY_API_VERSION=2026-04
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - APP_ENV=production
      - API_BASE_URL=https://api.pleero.app
      - FRONTEND_URL=https://pleero.app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pleero_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5.0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: pleero_caddy_prod
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile
      - ./origin-cert.pem:/data/origin-cert.pem:ro
      - ./origin-key.pem:/data/origin-key.pem:ro
      - caddy_data_prod:/data/caddy
      - caddy_config_prod:/config
    depends_on:
      - backend
    networks:
      - pleero_network
    restart: unless-stopped

volumes:
  postgres_data_prod:
  redis_data_prod:
  caddy_data_prod:
  caddy_config_prod:

networks:
  pleero_network:
    driver: bridge
