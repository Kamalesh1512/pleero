services:
  postgres:
    image: postgres:16-alpine
    container_name: pleero_postgres
    environment:
      POSTGRES_DB: pleero
      POSTGRES_USER: pleero_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pleero_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pleero_user -d pleero"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pleero_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - pleero_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pleero_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://pleero_user:${POSTGRES_PASSWORD}@postgres:5432/pleero
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SHOPIFY_API_VERSION=2026-04
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      # - SENTRY_DSN=${SENTRY_DSN}
      - APP_ENV=production
      - API_BASE_URL=https://api.pleero.app
      - FRONTEND_URL=https://pleero.app
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pleero_network
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: pleero_caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - pleero_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  pleero_network:
    driver: bridge
