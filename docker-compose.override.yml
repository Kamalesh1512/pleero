services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    environment:
      - APP_ENV=development
      - API_BASE_URL=https://api-dev.pleero.app
      - FRONTEND_URL=https://dev.pleero.app
    ports:
      - "8000:8000"
