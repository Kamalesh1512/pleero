# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "pleero"
client_id = "1a1d6eff5b104d69eae630f9a43d8779"
application_url = "https://pleero.app"
embedded = true

[access_scopes]
# See: https://shopify.dev/docs/api/usage/access-scopes
# write_orders: Covers refunds AND webhook subscriptions
# write_store_credit_account_transactions: Required for issuing store credit via GraphQL
# Note: write_customers intentionally omitted — customer GID comes from refund webhook payload
scopes = "write_orders,write_store_credit_account_transactions"

[auth]
redirect_urls = [
  "https://api.pleero.app/auth/callback"
]

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["refunds/create"]
uri = "https://api.pleero.app/webhooks/refunds/create"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://api.pleero.app/webhooks/app/uninstalled"

# Mandatory compliance webhooks — required for Shopify App Store approval.
# Must use compliance_topics (not topics). Requires Protected Customer Data Access.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://api.pleero.app/webhooks/compliance"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "e-comm-dev-store.myshopify.com"

[build.dev]
watch = ["frontend/**/*"]
