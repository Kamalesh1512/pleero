# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "pleero"
client_id = "ef7d7dc50496769b50b10e4812a05668"
application_url = "https://pleero.app"
embedded = true

[access_scopes]
scopes = "write_customers,write_orders,write_refunds,write_payment_terms"

[auth]
redirect_urls = [
  "https://api-dev.pleero.app/auth/callback",
  "https://api-dev.pleero.app/auth/shopify/callback"
]

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["refunds/create"]
uri = "/webhooks/refunds/create"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "e-comm-dev-store.myshopify.com"
include_config_on_deploy = true

[build.dev]
watch = ["frontend/**/*"]
