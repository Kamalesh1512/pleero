# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "pleero"
client_id = "ef7d7dc50496769b50b10e4812a05668"
application_url = "https://pleero.app"
embedded = true

[access_scopes]
# See: https://shopify.dev/docs/api/usage/access-scopes
# write_orders: Covers refunds AND webhook subscriptions
# write_customers: Customer management
# write_store_credit_account_transactions: Required for issuing store credit via GraphQL
scopes = "write_orders,write_customers,write_store_credit_account_transactions"

[auth]
redirect_urls = [
  "https://api.pleero.app/auth/callback",
  "https://api-dev.pleero.app/auth/callback",
  "https://api-dev.pleero.app/auth/shopify/callback"
]

[webhooks]
api_version = "2026-04"

[[webhooks.subscriptions]]
topics = ["refunds/create"]
uri = "https://api.pleero.app/webhooks/refunds/create"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "https://api.pleero.app/webhooks/app/uninstalled"

# Mandatory compliance webhooks — required for Shopify App Store approval.
# Shopify sends these for GDPR / CCPA / privacy law compliance.
# All three must return 200 and verify HMAC.
[[webhooks.subscriptions]]
topics = ["customers/data_request"]
uri = "https://api.pleero.app/webhooks/customers/data_request"

[[webhooks.subscriptions]]
topics = ["customers/redact"]
uri = "https://api.pleero.app/webhooks/customers/redact"

[[webhooks.subscriptions]]
topics = ["shop/redact"]
uri = "https://api.pleero.app/webhooks/shop/redact"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "e-comm-dev-store.myshopify.com"
include_config_on_deploy = true

[build.dev]
watch = ["frontend/**/*"]
