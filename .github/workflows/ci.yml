name: CI - Lint and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - develop

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_pleero
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv pip install --system .
          uv pip install --system ruff mypy pytest pytest-cov pytest-asyncio

      - name: Run ruff (linter)
        working-directory: ./backend
        run: ruff check .

      - name: Run ruff (formatter)
        working-directory: ./backend
        run: ruff format --check .

      - name: Run mypy (type checker)
        working-directory: ./backend
        run: mypy .
        continue-on-error: true

      - name: Run pytest
        working-directory: ./backend
        run: pytest -v --cov=app --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_pleero
          REDIS_URL: redis://localhost:6379/0
          SHOPIFY_API_KEY: test_key
          SHOPIFY_API_SECRET: test_secret
          ENCRYPTION_KEY: dGVzdF9lbmNyeXB0aW9uX2tleV8zMl9ieXRlcw==
          RESEND_API_KEY: test_resend
          APP_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
        continue-on-error: true

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: ./frontend
        run: pnpm lint

      - name: Run Prettier
        working-directory: ./frontend
        run: pnpm format:check
        continue-on-error: true

      - name: Type check
        working-directory: ./frontend
        run: pnpm type-check
        continue-on-error: true

      - name: Build
        working-directory: ./frontend
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.pleero.app
          NEXT_PUBLIC_SHOPIFY_API_KEY: test_key
