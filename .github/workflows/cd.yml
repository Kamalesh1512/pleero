# =============================================================================
# Continuous Deployment (CD) Workflow
# =============================================================================
# Runs ONLY on: main branch pushes (and manual triggers)
# Purpose: Build Docker images, deploy to production (DigitalOcean + Vercel)
#
# Version scheme: pleero-MAJOR.MINOR.PATCH
#   - Reads the latest git tag matching "pleero-*"
#   - Increments the patch number only when deployable code changes
#   - First-ever deploy uses pleero-1.0.0 (no prior tag needed)
#   - The new tag is pushed to the repo so subsequent runs increment correctly
#
# Path gating (jobs only run when their files change):
#   backend/**  docker-compose*.yml  → build-backend, deploy-backend
#   frontend/**                       → deploy-frontend
#   shopify.app.toml  extensions/**  → deploy-shopify-config
#   any of the above                  → version (tag + Docker label)
#
# workflow_dispatch bypasses all path gates (forces a full redeploy).
# =============================================================================

name: CD - Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only allow one production deployment at a time
concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ===========================================================================
  # DETECT WHICH PARTS OF THE CODEBASE CHANGED
  # Runs on every trigger; all other jobs consult its outputs.
  # workflow_dispatch forces all outputs to 'true' so a manual trigger
  # always runs the full deployment.
  # ===========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      shopify: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.shopify == 'true' }}
      any: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.any == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for accurate diff on squash merges

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
            frontend:
              - 'frontend/**'
            shopify:
              - 'shopify.app.toml'
              - 'extensions/**'
            any:
              - 'backend/**'
              - 'docker-compose*.yml'
              - 'frontend/**'
              - 'shopify.app.toml'
              - 'extensions/**'

  # ===========================================================================
  # DETERMINE VERSION & CREATE GIT TAG
  # Only runs (and tags) when something deployable actually changed.
  # ===========================================================================
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.any == 'true'
    permissions:
      contents: write   # needed to push the version tag back to the repo
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_short: ${{ steps.version.outputs.sha_short }}
      repo_lowercase: ${{ steps.version.outputs.repo_lowercase }}
    steps:
      - name: Checkout code (full history for tag reads)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required so all existing pleero-* tags are visible

      - name: Calculate version
        id: version
        run: |
          git fetch --tags

          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT

          # Read the highest existing pleero-X.Y.Z tag
          LATEST_TAG=$(git tag --list "pleero-*" --sort=-version:refname | head -1)

          if [ -z "$LATEST_TAG" ]; then
            # No tags yet — this is the first release
            VERSION="pleero-1.0.0"
          else
            NUMS="${LATEST_TAG#pleero-}"
            MAJOR=$(echo "$NUMS" | cut -d. -f1)
            MINOR=$(echo "$NUMS" | cut -d. -f2)
            PATCH=$(echo "$NUMS" | cut -d. -f3)
            VERSION="pleero-${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Lowercase repo name for Docker image references
          REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lowercase=${REPO_LOWERCASE}" >> $GITHUB_OUTPUT

          echo "🚀 Deploying version: ${VERSION} (${SHA_SHORT})"

      - name: Tag the commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

  # ===========================================================================
  # BUILD & PUSH BACKEND DOCKER IMAGE
  # Skipped when no backend/docker-compose files changed.
  # ===========================================================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs:
      - changes
      - version
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.version.outputs.repo_lowercase }}/pleero-backend
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ needs.version.outputs.sha_short }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image info
        run: |
          echo "✅ Backend image built and pushed"
          echo "Version tag : ${{ needs.version.outputs.version }}"
          echo "Latest tag  : latest"
          echo "Digest      : ${{ steps.build.outputs.digest }}"

  # ===========================================================================
  # DEPLOY BACKEND TO DIGITALOCEAN VPS
  # Skipped when no backend/docker-compose files changed.
  # ===========================================================================
  deploy-backend:
    name: Deploy Backend to DigitalOcean
    runs-on: ubuntu-latest
    needs:
      - changes
      - version
      - build-backend
    if: needs.changes.outputs.backend == 'true'
    environment:
      name: production
      url: https://api.pleero.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DIGITALOCEAN_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DIGITALOCEAN_HOST }} >> ~/.ssh/known_hosts

      - name: Write .env on runner
        run: |
          printf '%s\n' \
            "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" \
            "REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}" \
            "SHOPIFY_API_KEY=${{ secrets.SHOPIFY_API_KEY }}" \
            "SHOPIFY_API_SECRET=${{ secrets.SHOPIFY_API_SECRET }}" \
            "ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}" \
            "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" \
            "GITHUB_REPOSITORY=${{ needs.version.outputs.repo_lowercase }}" \
            > /tmp/pleero.env
          chmod 600 /tmp/pleero.env

      - name: Copy files to VPS
        run: |
          scp /tmp/pleero.env \
            ${{ secrets.DIGITALOCEAN_USER }}@${{ secrets.DIGITALOCEAN_HOST }}:/home/${{ secrets.DIGITALOCEAN_USER }}/app/.env
          scp docker-compose.production.yml \
            ${{ secrets.DIGITALOCEAN_USER }}@${{ secrets.DIGITALOCEAN_HOST }}:/home/${{ secrets.DIGITALOCEAN_USER }}/app/
          scp Caddyfile.production \
            ${{ secrets.DIGITALOCEAN_USER }}@${{ secrets.DIGITALOCEAN_HOST }}:/home/${{ secrets.DIGITALOCEAN_USER }}/app/Caddyfile.production

      - name: Pull image, migrate, restart containers
        run: |
          ssh ${{ secrets.DIGITALOCEAN_USER }}@${{ secrets.DIGITALOCEAN_HOST }} \
            "set -e
             cd /home/${{ secrets.DIGITALOCEAN_USER }}/app
             chmod 600 .env
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             docker pull ghcr.io/${{ needs.version.outputs.repo_lowercase }}/pleero-backend:${{ needs.version.outputs.version }}
             docker pull ghcr.io/${{ needs.version.outputs.repo_lowercase }}/pleero-backend:latest
             docker compose -f docker-compose.production.yml run --rm --pull never backend alembic upgrade head
             docker compose -f docker-compose.production.yml up -d --pull never --force-recreate backend caddy
             docker compose -f docker-compose.production.yml ps"

      - name: Wait for backend health
        run: |
          ssh ${{ secrets.DIGITALOCEAN_USER }}@${{ secrets.DIGITALOCEAN_HOST }} \
            "cd /home/${{ secrets.DIGITALOCEAN_USER }}/app
             for i in \$(seq 1 30); do
               if docker compose -f docker-compose.production.yml ps backend | grep -q '(healthy)'; then
                 echo 'Backend is healthy'; exit 0
               fi
               if [ \"\$i\" -eq 30 ]; then
                 docker compose -f docker-compose.production.yml logs backend --tail=60
                 exit 1
               fi
               echo \"Waiting... (\$i/30)\"; sleep 2
             done"

      - name: Verify Caddy and clean up images
        run: |
          ssh ${{ secrets.DIGITALOCEAN_USER }}@${{ secrets.DIGITALOCEAN_HOST }} \
            "cd /home/${{ secrets.DIGITALOCEAN_USER }}/app
             docker compose -f docker-compose.production.yml ps caddy | grep -q 'Up' \
               || { docker compose -f docker-compose.production.yml logs caddy --tail=50; exit 1; }
             echo 'Caddy is running'
             docker image prune -af --filter 'until=48h'
             echo 'Deploy of ${{ needs.version.outputs.version }} complete'"

      - name: Verify backend via external health check
        run: |
          sleep 10
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -sf https://api.pleero.app/health > /dev/null; then
              echo "✅ External health check passed"
              exit 0
            fi
            echo "  Attempt $i/$MAX_RETRIES failed, retrying in 5 s..."
            sleep 5
          done
          echo "❌ External health check failed after $MAX_RETRIES attempts"
          exit 1

  # ===========================================================================
  # SYNC SHOPIFY APP CONFIGURATION
  # Only runs when shopify.app.toml or extensions/ change.
  # Uses always() so it can inspect the deploy-backend result even when
  # deploy-backend was skipped (backend unchanged, but shopify config changed).
  # Requires secret: SHOPIFY_CLI_PARTNERS_TOKEN
  # ===========================================================================
  deploy-shopify-config:
    name: Deploy Shopify App Config
    runs-on: ubuntu-latest
    needs:
      - changes
      - version
      - deploy-backend
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.version.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      needs.changes.outputs.shopify == 'true'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Deploy app configuration to Shopify
        # --version sets a human-readable label in the Partners Dashboard
        # matching the git tag pushed earlier in this workflow run.
        run: |
          shopify app deploy \
            --allow-updates \
            --version "${{ needs.version.outputs.version }}"
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}

  # ===========================================================================
  # DEPLOY FRONTEND TO VERCEL
  # Skipped when no frontend files changed.
  # Uses always() so it can run even when deploy-backend was skipped.
  # ===========================================================================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs:
      - changes
      - version
      - deploy-backend
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.version.result == 'success' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      needs.changes.outputs.frontend == 'true'
    environment:
      name: production
      url: https://pleero.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Pull Vercel environment
        working-directory: ./frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build and Deploy to Vercel
        working-directory: ./frontend
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: https://api.pleero.app
          NEXT_PUBLIC_SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: Verify frontend deployment
        run: |
          sleep 10
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -sf https://pleero.app > /dev/null; then
              echo "✅ Frontend health check passed"
              exit 0
            fi
            echo "  Attempt $i/$MAX_RETRIES failed, retrying in 5 s..."
            sleep 5
          done
          echo "❌ Frontend health check failed after $MAX_RETRIES attempts"
          exit 1

  # ===========================================================================
  # DEPLOYMENT SUMMARY
  # ===========================================================================
  deployment-complete:
    name: Deployment Complete
    runs-on: ubuntu-latest
    needs:
      - changes
      - version
      - deploy-backend
      - deploy-shopify-config
      - deploy-frontend
    if: always()
    steps:
      - name: Check deployment status
        run: |
          BACKEND="${{ needs.deploy-backend.result }}"
          SHOPIFY="${{ needs.deploy-shopify-config.result }}"
          FRONTEND="${{ needs.deploy-frontend.result }}"
          VERSION="${{ needs.version.outputs.version }}"
          ANY_CHANGED="${{ needs.changes.outputs.any }}"

          echo "══════════════════════════════════════════"
          echo " Pleero deployment summary — ${VERSION:-no-op}"
          echo "══════════════════════════════════════════"
          echo " Backend (DigitalOcean) : ${BACKEND}"
          echo " Shopify app config     : ${SHOPIFY}"
          echo " Frontend (Vercel)      : ${FRONTEND}"
          echo "══════════════════════════════════════════"

          # If nothing deployable changed, report as no-op (not a failure)
          if [ "$ANY_CHANGED" != "true" ]; then
            echo "⏭️  No deployable files changed — all jobs skipped"
            exit 0
          fi

          # Fail if any active deployment explicitly failed
          if [ "$BACKEND" = "failure" ] || [ "$SHOPIFY" = "failure" ] || [ "$FRONTEND" = "failure" ]; then
            echo "❌ One or more deployments failed — check the logs above"
            exit 1
          fi

          # At least one deployment ran — report success
          echo "🎉 Deployment ${VERSION} complete"
          echo "   https://pleero.app        (frontend)"
          echo "   https://api.pleero.app    (backend)"
