# =============================================================================
# Continuous Deployment (CD) Workflow
# =============================================================================
# Runs ONLY on: main branch pushes
# Purpose: Build Docker images, deploy to production (DigitalOcean + Vercel)
# =============================================================================

name: CD - Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggers

# Only allow one deployment at a time
concurrency:
  group: production-deployment
  cancel-in-progress: false  # Don't cancel production deployments

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ===========================================================================
  # DETERMINE VERSION & PREP
  # ===========================================================================
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha_short: ${{ steps.version.outputs.sha_short }}
      repo_lowercase: ${{ steps.version.outputs.repo_lowercase }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Calculate version
        id: version
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "version=${SHA_SHORT}" >> $GITHUB_OUTPUT

          # Lowercase repository name for Docker
          REPO_LOWERCASE=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lowercase=${REPO_LOWERCASE}" >> $GITHUB_OUTPUT

          echo "🚀 Deploying version: ${SHA_SHORT}"

  # ===========================================================================
  # BUILD & PUSH DOCKER IMAGES
  # ===========================================================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ needs.version.outputs.repo_lowercase }}/pleero-backend
          tags: |
            type=raw,value=${{ needs.version.outputs.sha_short }}
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image info
        run: |
          echo "✅ Backend image built and pushed"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  # ===========================================================================
  # DEPLOY TO PRODUCTION
  # ===========================================================================
  deploy-backend:
    name: Deploy Backend to DigitalOcean
    runs-on: ubuntu-latest
    needs:
      - version
      - build-backend
    environment:
      name: production
      url: https://api.pleero.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DIGITALOCEAN_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DIGITALOCEAN_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deployment files to server
        run: |
          scp docker-compose.production.yml ${{ secrets.DIGITALOCEAN_USER }}@${{ secrets.DIGITALOCEAN_HOST }}:/home/${{ secrets.DIGITALOCEAN_USER }}/app/
          scp Caddyfile.production ${{ secrets.DIGITALOCEAN_USER }}@${{ secrets.DIGITALOCEAN_HOST }}:/home/${{ secrets.DIGITALOCEAN_USER }}/app/Caddyfile.production

      - name: Deploy backend
        run: |
          ssh ${{ secrets.DIGITALOCEAN_USER }}@${{ secrets.DIGITALOCEAN_HOST }} << 'EOF'
            set -e
            cd /home/${{ secrets.DIGITALOCEAN_USER }}/app

            # Create .env file from secrets
            cat > .env << 'ENVEOF'
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          SHOPIFY_API_KEY=${{ secrets.SHOPIFY_API_KEY }}
          SHOPIFY_API_SECRET=${{ secrets.SHOPIFY_API_SECRET }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          GITHUB_REPOSITORY=${{ needs.version.outputs.repo_lowercase }}
          IMAGE_TAG=${{ needs.version.outputs.sha_short }}
          ENVEOF

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker compose -f docker-compose.production.yml pull backend

            # Run database migrations
            docker compose -f docker-compose.production.yml run --rm backend alembic upgrade head

            # Deploy with force-recreate to ensure new image is used
            docker compose -f docker-compose.production.yml up -d --force-recreate backend caddy

            # Verify containers are running
            echo "🔍 Checking container status..."
            docker compose -f docker-compose.production.yml ps

            # Wait for backend health check
            echo "⏳ Waiting for backend to be healthy..."
            for i in {1..30}; do
              if docker compose -f docker-compose.production.yml ps backend | grep -q "healthy"; then
                echo "✅ Backend is healthy"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "❌ Backend failed to become healthy"
                docker compose -f docker-compose.production.yml logs backend --tail=50
                exit 1
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            # Verify caddy is running
            if ! docker compose -f docker-compose.production.yml ps caddy | grep -q "Up"; then
              echo "❌ Caddy is not running"
              docker compose -f docker-compose.production.yml logs caddy --tail=50
              exit 1
            fi
            echo "✅ Caddy is running"

            # Clean up old images
            docker image prune -af --filter "until=48h"

            echo "✅ Backend deployed successfully"
          EOF

      - name: Verify backend deployment
        run: |
          sleep 10
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -sf https://api.pleero.app/health > /dev/null; then
              echo "✅ Backend health check passed"
              exit 0
            fi
            echo "Health check failed (attempt $i/$MAX_RETRIES)"
            sleep 5
          done
          echo "❌ Backend health check failed after $MAX_RETRIES attempts"
          exit 1

  # ===========================================================================
  # SYNC SHOPIFY APP CONFIGURATION
  # Must run AFTER deploy-backend so webhook endpoints are live when registered.
  # Runs in parallel with deploy-frontend.
  # Requires secret: SHOPIFY_CLI_PARTNERS_TOKEN
  #   → Partner Dashboard → Settings → Partner API clients → Create API client
  # ===========================================================================
  deploy-shopify-config:
    name: Deploy Shopify App Config
    runs-on: ubuntu-latest
    needs:
      - version
      - deploy-backend
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli@latest

      - name: Deploy app configuration to Shopify
        # GitHub Actions sets CI=true automatically — Shopify CLI skips interactive prompts in CI mode
        run: shopify app deploy
        env:
          SHOPIFY_CLI_PARTNERS_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNERS_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: version
    environment:
      name: production
      url: https://pleero.app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Pull Vercel Environment
        working-directory: ./frontend
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Frontend
        working-directory: ./frontend
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_API_URL: https://api.pleero.app
          NEXT_PUBLIC_SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}

      - name: Deploy to Vercel
        working-directory: ./frontend
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify frontend deployment
        run: |
          sleep 10
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -sf https://pleero.app > /dev/null; then
              echo "✅ Frontend health check passed"
              exit 0
            fi
            echo "Health check failed (attempt $i/$MAX_RETRIES)"
            sleep 5
          done
          echo "❌ Frontend health check failed after $MAX_RETRIES attempts"
          exit 1

  # ===========================================================================
  # DEPLOYMENT SUMMARY
  # ===========================================================================
  deployment-complete:
    name: Deployment Complete
    runs-on: ubuntu-latest
    needs:
      - version
      - deploy-backend
      - deploy-shopify-config
      - deploy-frontend
    if: always()
    steps:
      - name: Check deployment status
        run: |
          BACKEND="${{ needs.deploy-backend.result }}"
          SHOPIFY="${{ needs.deploy-shopify-config.result }}"
          FRONTEND="${{ needs.deploy-frontend.result }}"

          if [ "$BACKEND" = "success" ] && [ "$FRONTEND" = "success" ] && [ "$SHOPIFY" = "success" ]; then
            echo "🎉 Deployment of version ${{ needs.version.outputs.version }} completed successfully!"
            echo "Backend:        https://api.pleero.app"
            echo "Frontend:       https://pleero.app"
            echo "Shopify config: synced"
            exit 0
          else
            echo "❌ Deployment failed"
            echo "Backend:        $BACKEND"
            echo "Shopify config: $SHOPIFY"
            echo "Frontend:       $FRONTEND"
            exit 1
          fi
